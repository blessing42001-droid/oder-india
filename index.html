<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🇮🇳 인도 친구들의 하루 순서 맞추기</title><style>
:root{--ink:#263647;--orange:#ff8c2f;--green:#27a568;--blue:#eef8ff;--shadow:0 10px 28px rgba(35,49,66,.15)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:linear-gradient(145deg,#fff5d9,#eef8ff);color:var(--ink)}
.viewport{position:relative;width:100vw;height:100vh}.board{position:absolute;left:50%;top:50%;width:1500px;height:840px;transform-origin:center center;background:#fff;border-radius:34px;box-shadow:var(--shadow);border:3px solid #ffe0b2;padding:24px 32px;display:flex;flex-direction:column;gap:12px}
.head{text-align:center;flex:0 0 auto}.head h1{font-size:43px;margin:0 0 5px;font-weight:900;letter-spacing:-1.2px}.head p{font-size:22px;margin:0;color:#607083;font-weight:800}.hint{display:inline-block;margin-top:7px;background:#eff8ff;border-radius:999px;padding:7px 16px;font-size:17px;color:#52677b;font-weight:700}
.sectionTitle{font-size:21px;font-weight:900;margin:0 0 7px 4px;color:#40566b}
.timeline{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 260px;min-height:0}
.slot{flex:1 1 0;min-width:0;height:235px;border:4px dashed #bfcbd5;border-radius:24px;background:#f9fbfd;display:flex;align-items:center;justify-content:center;position:relative;transition:.15s;overflow:hidden}
.slot::before{content:attr(data-num);position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:#e6edf3;display:grid;place-items:center;font-size:18px;font-weight:900;color:#5e6f80;z-index:2}
.slot.empty::after{content:'여기에 놓기';font-size:21px;font-weight:900;color:#a0adba}.slot.over{border-color:#ff9b45;background:#fff7ed;transform:translateY(-3px)}.slot.good{border-style:solid;border-color:#35b76f;background:#f0fff6}.slot.bad{border-style:solid;border-color:#ef7171;background:#fff5f5}
.arrow{font-size:40px;font-weight:900;color:#ff9b45;flex:0 0 40px;text-align:center;filter:drop-shadow(0 2px 0 #ffe1c5)}
.placed{width:100%;height:100%;padding:9px;cursor:grab;user-select:none}.placed img{width:100%;height:175px;object-fit:cover;border-radius:16px;display:block;background:#eef2f5}.placed .label{font-size:21px;font-weight:900;text-align:center;margin-top:6px;line-height:1.15}.placed.selected{outline:7px solid #ffd259;outline-offset:-6px;border-radius:20px}
.poolWrap{flex:1 1 auto;min-height:0;background:#fff9ef;border:3px solid #ffe4b7;border-radius:25px;padding:12px 14px;display:flex;flex-direction:column}.pool{display:flex;justify-content:center;align-items:stretch;gap:12px;flex:1;min-height:0}
.source{flex:0 1 210px;max-width:220px;min-width:0;background:#fff;border:3px solid #e3e9ef;border-radius:20px;padding:8px;box-shadow:0 6px 0 #dbe2e8;cursor:grab;user-select:none;transition:.15s}.source:hover{transform:translateY(-3px);border-color:#ffb875}.source.selected{outline:7px solid #ffd259;transform:translateY(-3px)}.source.dragging,.placed.dragging{opacity:.42}.source img{width:100%;height:140px;object-fit:cover;border-radius:14px;display:block;background:#eef2f5}.source .label{font-size:19px;font-weight:900;text-align:center;margin-top:7px;line-height:1.15}
.footer{display:flex;align-items:center;justify-content:center;gap:18px;flex:0 0 58px}.btn{border:0;border-radius:18px;padding:12px 26px;font-size:21px;font-weight:900;cursor:pointer}.check{background:var(--green);color:white;box-shadow:0 6px 0 #187748}.reset{background:#eef2f5;color:#425265;box-shadow:0 6px 0 #d3dce4}.msg{min-width:430px;text-align:center;font-size:23px;font-weight:900;color:#526171}.msg.ok{color:#15864c}.msg.no{color:#cc5b2e}
@media(max-width:800px){.hint{font-size:16px}}
</style></head><body><div class="viewport"><main class="board" id="board"><header class="head"><h1>🇮🇳 인도 친구들의 하루 순서 맞추기</h1><p>아래 사진을 위 빈칸에 시간 순서대로 옮겨 보세요.</p><div class="hint">사진을 끌어 놓거나, 사진을 누른 뒤 원하는 빈칸을 눌러도 돼요.</div></header><div><div class="sectionTitle">① 하루 순서</div><section class="timeline" id="timeline"></section></div><section class="poolWrap" id="poolWrap"><div class="sectionTitle">② 사진 카드</div><div class="pool" id="pool"></div></section><footer class="footer"><button class="btn reset" onclick="resetGame()">↻ 처음부터</button><div class="msg" id="msg">아래 사진부터 하나씩 옮겨 보세요!</div><button class="btn check" onclick="checkOrder()">✓ 순서 확인</button></footer></main></div><script>

let slots=Array(items.length).fill(null);
let poolOrder=shuffle([...items.keys()]);
let selected=null; // {type:'pool'|'slot', index:number}
const timeline=document.getElementById('timeline'), pool=document.getElementById('pool'), msg=document.getElementById('msg');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
 timeline.innerHTML='';
 for(let i=0;i<slots.length;i++){
  const s=document.createElement('div');s.className='slot '+(slots[i]===null?'empty':'');s.dataset.num=i+1;s.dataset.slot=i;
  s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');handleDrop(i,e)});s.addEventListener('click',()=>handleSlotClick(i));
  if(slots[i]!==null){const idx=slots[i];const p=document.createElement('div');p.className='placed'+(selected&&selected.type==='slot'&&selected.index===i?' selected':'');p.draggable=true;p.innerHTML=`<img src="${items[idx].img}"><div class="label">${items[idx].label}</div>`;p.addEventListener('dragstart',e=>{p.classList.add('dragging');e.dataTransfer.setData('application/x-source',JSON.stringify({type:'slot',index:i}));});p.addEventListener('dragend',()=>p.classList.remove('dragging'));p.addEventListener('click',e=>{e.stopPropagation();select({type:'slot',index:i})});s.appendChild(p)}
  timeline.appendChild(s);if(i<slots.length-1){const a=document.createElement('div');a.className='arrow';a.textContent='➜';timeline.appendChild(a)}
 }
 pool.innerHTML='';poolOrder.forEach((idx,pos)=>{const c=document.createElement('div');c.className='source'+(selected&&selected.type==='pool'&&selected.index===idx?' selected':'');c.draggable=true;c.innerHTML=`<img src="${items[idx].img}"><div class="label">${items[idx].label}</div>`;c.addEventListener('dragstart',e=>{c.classList.add('dragging');e.dataTransfer.setData('application/x-source',JSON.stringify({type:'pool',index:idx}));});c.addEventListener('dragend',()=>c.classList.remove('dragging'));c.addEventListener('click',()=>select({type:'pool',index:idx}));pool.appendChild(c)});
}
function select(src){selected=selected&&selected.type===src.type&&selected.index===src.index?null:src;msg.textContent=selected?'놓을 빈칸을 눌러보세요.':'아래 사진부터 하나씩 옮겨 보세요!';render()}
function handleSlotClick(slotIndex){if(selected){placeSource(selected,slotIndex);selected=null;render()}}
function handleDrop(slotIndex,e){let src=null;try{src=JSON.parse(e.dataTransfer.getData('application/x-source'))}catch{}if(src){placeSource(src,slotIndex);selected=null;render()}}
function placeSource(src,to){
 if(src.type==='pool'){const item=src.index;const occupied=slots[to];slots[to]=item;poolOrder=poolOrder.filter(x=>x!==item);if(occupied!==null)poolOrder.push(occupied)}
 else if(src.type==='slot'){const from=src.index;if(from===to)return;const moving=slots[from],occupied=slots[to];slots[to]=moving;slots[from]=occupied;}
 msg.textContent='좋아요! 다음 사진도 옮겨 보세요.';
}
poolWrap.addEventListener('dragover',e=>e.preventDefault());poolWrap.addEventListener('drop',e=>{e.preventDefault();let src=null;try{src=JSON.parse(e.dataTransfer.getData('application/x-source'))}catch{}if(src&&src.type==='slot'){const item=slots[src.index];if(item!==null){slots[src.index]=null;poolOrder.push(item);selected=null;render();}}});
function checkOrder(){document.querySelectorAll('.slot').forEach(x=>x.classList.remove('good','bad'));if(slots.some(x=>x===null)){msg.textContent='👀 아직 비어 있는 칸이 있어요!';msg.className='msg no';return}let ok=true;const ss=[...document.querySelectorAll('.slot')];slots.forEach((v,i)=>{if(v===i)ss[i].classList.add('good');else{ss[i].classList.add('bad');ok=false}});if(ok){msg.textContent='🎉 정답! 시간 순서가 맞아요!';msg.className='msg ok'}else{msg.textContent='👀 순서가 다른 사진이 있어요. 다시 옮겨볼까요?';msg.className='msg no'}}
function resetGame(){slots=Array(items.length).fill(null);poolOrder=shuffle([...items.keys()]);selected=null;msg.textContent='아래 사진부터 하나씩 옮겨 보세요!';msg.className='msg';render()}
function fit(){const b=document.getElementById('board');const scale=Math.min((innerWidth-18)/1500,(innerHeight-18)/840,1);b.style.transform=`translate(-50%,-50%) scale(${scale})`}
addEventListener('resize',fit);render();fit();
</script></body></html>
